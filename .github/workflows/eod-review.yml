name: Daily EOD review and engine health

on:
  workflow_dispatch:
  schedule:
    # 21:10 UTC = 16:10 ET in standard time and 17:10 ET in daylight time.
    - cron: '10 21 * * *'

permissions:
  contents: read

concurrency:
  group: saty-dashboard-data
  queue: max
  cancel-in-progress: false

jobs:
  review:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: true
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
      - run: python -m pip install -r requirements.txt
      - name: Restore dashboard-data persistent state
        run: python scripts/sync_state.py prepare
      - name: Finalize recorded bars and decisions
        id: capture
        continue-on-error: true
        run: python scripts/refresh_tv_market.py --output site/data/market.json --state-dir .dashboard-state/state
      - name: Grade confirmed-bar outcomes and check engine health
        run: python scripts/daily_eod_review.py
      - name: Replay executable challenger on subsequent complete sessions
        run: node scripts/run_shadow.mjs --state-dir .dashboard-state/state
      - name: Measure approved runner and no-runner policies plus direction radar
        run: node scripts/review_approved.mjs --state-dir .dashboard-state/state
      - name: Audit hidden trigger-retest challenger in fixed and runner modes
        run: node scripts/review_retest.mjs --state-dir .dashboard-state/state
      - name: Capture hidden pullback VIX and overnight research context
        run: python scripts/capture_pullback_context.py --state-dir .dashboard-state/state
      - name: Measure hidden Saty 21 Pullback plus VIX challenger
        run: node scripts/review_pullback_vix.mjs --state-dir .dashboard-state/state
      - name: Measure live Level Bounce separately from MAIN and shadow strategies
        run: node scripts/review_level_bounce.mjs --state-dir .dashboard-state/state
      - name: Capture hidden Level Bounce v2 native timeframe context
        run: python scripts/capture_bounce_v2_context.py --state-dir .dashboard-state/state
      - name: Measure hidden Level Bounce v2 independently
        run: node scripts/review_bounce_v2.mjs --state-dir .dashboard-state/state
      - name: Persist review, alarms, and dated challenger changelog
        run: python scripts/sync_state.py commit
      - name: Verify emitted review documents
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for name in ('eod-review.json','health-alarms.json','changelog.json'):
              data=json.loads((Path('site/data')/name).read_text())
              assert data.get('schema_version') == 1, name
          print('EOD review, health alarms, and changelog JSON validated.')
          PY
