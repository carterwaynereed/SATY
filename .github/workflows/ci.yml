name: Validate dashboard

on:
  pull_request:
  push:
    branches: [main]
    paths-ignore: ['docs/**', '**.md']

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Build evidence and learning summaries
        run: |
          python scripts/summarize_evidence.py
          python scripts/summarize_learning.py
      - name: Offline behavior and causality tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Browser logic tests
        run: node --test tests/*.test.mjs
      - name: Validate public artifact and frozen engine
        run: python scripts/validate_site.py
      - name: Python syntax
        run: python -m compileall -q saty_dashboard scripts engine
      - name: Archive reviewed public source for reproducibility
        run: git archive --format=zip --output=validated-source.zip HEAD
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: validated-source
          path: validated-source.zip
          retention-days: 3
