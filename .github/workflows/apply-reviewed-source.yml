name: Apply hash-verified reviewed PR source
on:
  push:
    branches: [fix/eod-data-ledger-shadow]
    paths: ['.delivery/**']
permissions:
  contents: read
jobs:
  apply:
    if: github.repository == 'carterwaynereed/SATY' && github.ref == 'refs/heads/fix/eod-data-ledger-shadow'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 2
      - name: Verify exact reviewed delta and source hashes
        run: |
          python3 - <<'PY'
          import hashlib, json, lzma, subprocess
          from pathlib import Path, PurePosixPath
          base = subprocess.check_output(['git','rev-parse','HEAD^']).decode().strip()
          assert base == 'a1b4f45bca68ad7c94af5e102ded28e6b42c2bae', 'Unexpected source base; refusing mutation'
          parts = sorted(Path('.delivery').glob('part-*.xz'))
          assert len(parts) == 6
          compressed = b''.join(p.read_bytes() for p in parts)
          assert hashlib.sha256(compressed).hexdigest() == '4b1b523190ae09d511857cf4d4b0acca7d2b24829f230d6f483781e3938c3eb7', 'Delivery hash mismatch'
          changes = json.loads(lzma.decompress(compressed))
          assert len(changes) == 34
          pending = {}
          for name, change in changes.items():
              path = PurePosixPath(name)
              assert not path.is_absolute() and '..' not in path.parts and not any(p.startswith('.') for p in path.parts), 'Unsafe path'
              dest = Path(name)
              assert not dest.is_symlink()
              original = dest.read_text(encoding='utf-8') if dest.exists() else ''
              assert hashlib.sha256(original.encode()).hexdigest() == change['base_sha256'], 'Base file differs: '+name
              result = original
              for start, end, replacement in reversed(change['replacements']):
                  assert 0 <= start <= end <= len(original)
                  result = result[:start] + replacement + result[end:]
              assert hashlib.sha256(result.encode()).hexdigest() == change['sha256'], 'Result hash differs: '+name
              pending[dest] = result
          for path, result in pending.items():
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_text(result, encoding='utf-8')
          Path('.delivery/paths').write_bytes(b'\0'.join(str(p).encode() for p in pending)+b'\0')
          print('Applied 34 exact reviewed source files. Workflow changes are handled separately; live rules unchanged.')
          PY
      - name: Save reviewed source on this PR branch only
        run: |
          git add --pathspec-from-file=.delivery/paths --pathspec-file-nul
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'feat: add tested 1m data, public input sync, decision ledger and shadow replay'
          git push origin HEAD:refs/heads/fix/eod-data-ledger-shadow
